<div id="notepadTab" class="tab-pane">

  <div class="notepad-header">
    <h2 data-i18n="notepadTitle"></h2>
    <div class="notepad-header-actions">
      <div id="notepadStatus" class="notepad-status" role="status" aria-live="polite"></div>
      <div id="notepadSearchShell" class="notepad-search-shell" role="search">
        <div id="notepadSearchPanel" class="notepad-search-panel" aria-hidden="true">
          <input id="notepadSearchInput" class="notepad-search-input" type="text" data-i18n="notepadSearchPlaceholder" data-label-key="notepadSearchPlaceholder" />
          <span id="notepadSearchCount" class="notepad-search-count" aria-live="polite"></span>
          <button id="notepadSearchPrevButton" class="button button-secondary icon-button notepad-search-nav" type="button" data-label-key="notepadSearchPrev">
            <img src="../img/icons/chevron-up.svg" alt="" aria-hidden="true" />
          </button>
          <button id="notepadSearchNextButton" class="button button-secondary icon-button notepad-search-nav" type="button" data-label-key="notepadSearchNext">
            <img src="../img/icons/chevron-down.svg" alt="" aria-hidden="true" />
          </button>
        </div>
        <button id="notepadSearchToggle" class="button button-secondary icon-button notepad-search-toggle" type="button" data-label-key="notepadSearchOpen" aria-expanded="false" aria-controls="notepadSearchPanel">
          <img class="notepad-search-toggle-icon is-closed-icon" src="../img/icons/search.svg" alt="" aria-hidden="true" />
          <img class="notepad-search-toggle-icon is-open-icon" src="../img/icons/close.svg" alt="" aria-hidden="true" />
        </button>
      </div>
      <div class="notepad-view-switch" role="group" data-label-key="notepadViewMode">
        <button class="notepad-view-button" type="button" data-view-mode="split" data-label-key="notepadViewSplit">
          <img src="../img/icons/split.svg" alt="" aria-hidden="true" />
        </button>
        <button class="notepad-view-button" type="button" data-view-mode="preview" data-label-key="notepadViewPreview">
          <img src="../img/icons/preview.svg" alt="" aria-hidden="true" />
        </button>
      </div>
    </div>
  </div>

  <div class="notepad-frame">
    <div class="notepad-toolbar" role="toolbar">
      <div class="notepad-tool-group">
        <label class="board-autosave notepad-autosave" for="notepadAutosaveToggle">
          <input id="notepadAutosaveToggle" type="checkbox" />
          <span class="slider" aria-hidden="true"></span>
          <span data-i18n="notepadAutosaveLabel"></span>
        </label>
        <button id="notepadSaveButton" class="notepad-tool-btn notepad-save-button" type="button" data-label-key="saveButton">
          <img src="../img/icons/save.svg" alt="" aria-hidden="true" />
        </button>
        <button id="notepadUndoButton" class="notepad-tool-btn notepad-history-button" type="button" data-label-key="boardActionUndo">
          <img src="../img/icons/undo.svg" alt="" aria-hidden="true" />
        </button>
        <button id="notepadRedoButton" class="notepad-tool-btn notepad-history-button" type="button" data-label-key="boardActionRedo">
          <img src="../img/icons/redo.svg" alt="" aria-hidden="true" />
        </button>
      </div>

      <span class="notepad-tool-sep" aria-hidden="true"></span>

      <div class="notepad-tool-group">
        <button class="notepad-tool-btn notepad-format-button" type="button" data-format="bold" data-label-key="notepadFormatBold">
          <img src="../img/icons/bold.svg" alt="" aria-hidden="true" />
        </button>
        <button class="notepad-tool-btn notepad-format-button" type="button" data-format="italic" data-label-key="notepadFormatItalic">
          <img src="../img/icons/italic.svg" alt="" aria-hidden="true" />
        </button>
        <button class="notepad-tool-btn notepad-format-button" type="button" data-format="link" data-label-key="notepadFormatLink">
          <img src="../img/icons/link.svg" alt="" aria-hidden="true" />
        </button>
        <button class="notepad-tool-btn notepad-format-button" type="button" data-format="code" data-label-key="notepadFormatCode">
          <img src="../img/icons/code.svg" alt="" aria-hidden="true" />
        </button>
        <button class="notepad-tool-btn notepad-format-button" type="button" data-format="list" data-label-key="notepadFormatList">
          <img src="../img/icons/list.svg" alt="" aria-hidden="true" />
        </button>
        <button class="notepad-tool-btn notepad-format-button" type="button" data-format="quote" data-label-key="notepadFormatQuote">
          <img src="../img/icons/quote.svg" alt="" aria-hidden="true" />
        </button>
        <button class="notepad-tool-btn notepad-format-button" type="button" data-format="checkbox" data-label-key="notepadFormatCheckbox">
          <img src="../img/icons/checkbox.svg" alt="" aria-hidden="true" />
        </button>
      </div>

      <span class="notepad-tool-sep" aria-hidden="true"></span>

      <div class="notepad-tool-group">
        <button class="notepad-tool-btn notepad-format-button" type="button" data-format="heading1" data-label-key="notepadFormatHeading1">
          <img src="../img/icons/h1.svg" alt="" aria-hidden="true" />
        </button>
        <button class="notepad-tool-btn notepad-format-button" type="button" data-format="heading2" data-label-key="notepadFormatHeading2">
          <img src="../img/icons/h2.svg" alt="" aria-hidden="true" />
        </button>
        <button class="notepad-tool-btn notepad-format-button" type="button" data-format="heading3" data-label-key="notepadFormatHeading3">
          <img src="../img/icons/h3.svg" alt="" aria-hidden="true" />
        </button>
      </div>
    </div>

    <div class="notepad-wrapper">
      <textarea id="notepadArea" class="notepad-textarea" data-i18n-placeholder="notepadPlaceholder"></textarea>
      <div id="notepadPreview" class="notepad-preview"></div>
    </div>
  </div>

</div>
