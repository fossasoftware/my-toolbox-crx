<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title data-i18n="appName"></title>
  <link rel="stylesheet" href="./options-main.css">
  <link rel="stylesheet" href="../features/colorizer/colorizer.css">
  <link rel="stylesheet" href="../features/row-highlighter/row-highlighter.css">
  <link rel="stylesheet" href="../features/notepad/notepad.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
  <script type="module" src="https://unpkg.com/@material/web/all.js?module"></script>
</head>
<body>

  <div id="sideRibbon" class="side-ribbon">
    <button id="menuToggle" class="menu-toggle">☰</button>
    <div class="app-vertical" data-i18n="appName"></div>
  </div>

  <nav id="sideMenu" class="side-menu">
    <div class="options-header">
      <h1 data-i18n="menuLabel"></h1>
      <div class="language-buttons">
        <div class="lang-highlight"></div>
        <button class="lang-option" data-lang="en">🇬🇧 EN</button>
        <button class="lang-option" data-lang="uk">🇺🇦 УК</button>
      </div>
    </div>
    <div class="tab-nav">
      <button class="tab-link active" data-tab="colorizerTab" data-i18n="optionsTabColorizer"></button>
      <button class="tab-link" data-tab="rowHighlighterTab" data-i18n="optionsTabRowHighlighter"></button>
      <button class="tab-link" data-tab="notepadTab" data-i18n="optionsTabNotepad"></button>
    </div>
    <div class="footer">
      <p data-i18n="footerText"></p>
      <p id="appVersion"></p>
    </div>
  </nav>

  <div class="page-container">

    <div class="tab-content">
      <div id="colorizerTab" class="tab-pane active">
      <h2 data-i18n="colorizerTitle"></h2>
      <table class="colorizer-table" id="statusTable">
        <thead>
          <tr>
            <th scope="col" data-i18n="settingsTableStatus"></th>
            <th scope="col" data-i18n="settingsTableBackground"></th>
            <th scope="col" data-i18n="settingsTableText"></th>
            <th scope="col" data-i18n="settingsTableAnimation"></th>
            <th scope="col" data-i18n="settingsTablePrimaryColor"></th>
            <th scope="col" data-i18n="settingsTableSecondaryColor"></th>
            <th scope="col" data-i18n="settingsTableRemoveRow"></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>

      <div class="button-container">
        <div class="button-group-left">
            <md-filled-button id="addRow"><span class="material-symbols-outlined">add</span><span class="btn-label" data-i18n="addRowButton"></span></md-filled-button>
            <md-filled-button id="saveSettings"><span class="material-symbols-outlined">save</span><span class="btn-label" data-i18n="saveButton"></span></md-filled-button>
            <md-filled-button id="clearAll" class="danger"><span class="material-symbols-outlined">refresh</span><span class="btn-label" data-i18n="resetButton"></span></md-filled-button>
            <md-outlined-button id="resetStatusSettings" data-i18n="defaultButton"></md-outlined-button>
        </div>
        <div class="button-group-right">
            <input type="file" id="importFile" accept=".json" style="display: none;">
            <md-outlined-button id="importSettingsBtn"><span class="material-symbols-outlined">file_upload</span><span class="btn-label" data-i18n="importButton"></span></md-outlined-button>
            <md-outlined-button id="exportSettingsBtn"><span class="material-symbols-outlined">file_download</span><span class="btn-label" data-i18n="exportButton"></span></md-outlined-button>
        </div>
      </div>

      <div id="confirmModal" class="modal-overlay">
        <div class="modal-box">
          <h5 data-i18n="confirmResetTableTitle"></h5>
          <p data-i18n="confirmResetTableText"></p>
          <div class="modal-actions">
            <md-filled-button id="confirmDelete" class="danger" data-i18n="confirmResetTableYes"></md-filled-button>
            <md-outlined-button id="cancelDelete" data-i18n="confirmResetTableCancel"></md-outlined-button>
          </div>
        </div>
      </div>
      <div id="resetConfirmModal" class="modal-overlay">
         <div class="modal-box">
           <h5 data-i18n="confirmDefaultTitle"></h5>
           <p data-i18n="confirmDefaultText"></p>
           <div class="modal-actions">
             <md-filled-button id="confirmReset" data-i18n="confirmDefaultYes"></md-filled-button>
             <md-outlined-button id="cancelReset" data-i18n="confirmDefaultCancel"></md-outlined-button>
           </div>
         </div>
       </div>
      </div>

    <div id="rowHighlighterTab" class="tab-pane">
      <h2 data-i18n="rowHighlighterTitle"></h2>
      <table class="highlighter-table" id="rowHighlightTable">
        <thead>
          <tr>
            <th scope="col" data-i18n="settingsTableKeyword"></th>
            <th scope="col" data-i18n="settingsTableColor"></th>
            <th scope="col" data-i18n="settingsTableRemoveRow"></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>

      <div class="button-container">
        <div class="button-group-left">
            <md-filled-button id="rowHighlightAdd"><span class="material-symbols-outlined">add</span><span class="btn-label" data-i18n="addKeywordButton"></span></md-filled-button>
            <md-filled-button id="rowHighlightSave"><span class="material-symbols-outlined">save</span><span class="btn-label" data-i18n="saveButton"></span></md-filled-button>
            <md-filled-button id="rowHighlightReset" class="danger"><span class="material-symbols-outlined">refresh</span><span class="btn-label" data-i18n="resetButton"></span></md-filled-button>
        </div>
        <div class="button-group-right">
            <input type="file" id="rowHighlightImportFile" accept=".json" style="display: none;">
            <md-outlined-button id="rowHighlightImport"><span class="material-symbols-outlined">file_upload</span><span class="btn-label" data-i18n="importButton"></span></md-outlined-button>
            <md-outlined-button id="rowHighlightExport"><span class="material-symbols-outlined">file_download</span><span class="btn-label" data-i18n="exportButton"></span></md-outlined-button>
        </div>
      </div>
      <div id="rowHighlightResetModal" class="modal-overlay">
        <div class="modal-box">
          <h5 data-i18n="confirmResetTableTitle"></h5>
          <p data-i18n="confirmResetTableText"></p>
          <div class="modal-actions">
            <md-filled-button id="rowHighlightConfirmReset" class="danger" data-i18n="confirmResetTableYes"></md-filled-button>
            <md-outlined-button id="rowHighlightCancelReset" data-i18n="confirmResetTableCancel"></md-outlined-button>
          </div>
        </div>
      </div>
    </div>

    <div id="notepadTab" class="tab-pane">

      <h2 data-i18n="notepadTitle"></h2>
      <div class="notepad-wrapper">
        <textarea id="notepadArea" class="notepad-textarea" data-i18n-placeholder="notepadPlaceholder"></textarea>
        <div id="notepadPreview" class="notepad-preview"></div>
      </div>
      <div id="notepadStatus" class="notepad-status"></div>
      
    </div>

  </div>

  <div id="toast" class="toast"></div>

  <div id="validationErrorModal" class="modal-overlay">
    <div class="modal-box">
      <h5 data-i18n="validationErrorTitle"></h5>
      <p id="validationErrorMessage"></p>
      <div class="modal-actions">
        <md-filled-button id="validationErrorOkBtn" data-i18n="validationErrorOk"></md-filled-button>
      </div>
    </div>
  </div>

  </div>

  <script src="../libs/marked.min.js"></script>
  <script src="../libs/purify.min.js"></script>
  <script type="module" src="./options-main.js"></script>
</body>
</html>
