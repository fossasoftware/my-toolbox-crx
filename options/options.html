<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title data-i18n="appName"></title>
  <link rel="stylesheet" href="./options-main.css">
  <link rel="stylesheet" href="../features/status-colorizer/status-colorizer.css">
  <link rel="stylesheet" href="../features/row-highlighter/row-highlighter.css">
  <link rel="stylesheet" href="../features/notepad/notepad.css">
  <link rel="stylesheet" href="../features/board/board.css">
  <link rel="stylesheet" href="../features/settings/settings.css">
  <link rel="stylesheet" href="../features/bookmarks/bookmarks.css">
</head>
<body class="is-booting">

  <div id="sideRibbon" class="side-ribbon">
    <button id="menuToggle" class="menu-toggle">☰</button>
    <div id="bookmarksPinnedContainer" class="bookmarks-pinned">
      <h4 data-i18n="bookmarksPinnedTitle"></h4>
      <ul id="bookmarksPinnedList" class="bookmarks-pinned-list"></ul>
      <p id="bookmarksPinnedEmpty" class="bookmarks-pinned-empty" data-i18n="bookmarksPinnedEmpty"></p>
    </div>
    <div class="app-vertical" data-i18n="appName"></div>
  </div>

  <nav id="sideMenu" class="side-menu">
    <div class="options-header">
      <h1 data-i18n="menuLabel"></h1>
      <div class="language-buttons">
        <div class="lang-highlight"></div>
        <button class="lang-option" data-lang="en">🇬🇧 EN</button>
        <button class="lang-option" data-lang="uk">🇺🇦 УК</button>
      </div>
    </div>
    <div class="tab-nav">
      <div class="tab-group is-open">
        <button class="tab-group-toggle" type="button" data-i18n="optionsTabHelpers" aria-expanded="true"></button>
        <div class="tab-group-items">
          <button class="tab-link" data-tab="statusColorizerTab" data-i18n="optionsTabStatusColorizer"></button>
          <button class="tab-link" data-tab="rowHighlighterTab" data-i18n="optionsTabRowHighlighter"></button>
        </div>
      </div>
      <button class="tab-link" data-tab="notepadTab" data-i18n="optionsTabNotepad"></button>
      <button class="tab-link" data-tab="boardTab" data-i18n="optionsTabBoard"></button>
      <button class="tab-link" data-tab="bookmarksTab" data-i18n="optionsTabBookmarks"></button>
      <button class="tab-link" data-tab="settingsTab" data-i18n="optionsTabSettings"></button>
    </div>
    <div class="footer">
      <p id="appVersion"></p>
      <div class="footer-actions">
        <a
          id="chromeStoreLink"
          class="footer-link"
          href="https://chromewebstore.google.com/detail/my-toolbox/nppomdgnebmeeilmhbkdnidaohhblcbi"
          target="_blank"
          rel="noreferrer noopener"
          data-i18n="footerStoreLink"
        ></a>
        <button
          id="shareExtensionBtn"
          class="footer-share"
          type="button"
          data-i18n="footerShareButton"
        ></button>
      </div>
    </div>
  </nav>

  <div class="page-container">

    <div class="tab-content">
      <div id="statusColorizerTabContainer"></div>
      <div id="rowHighlighterTabContainer"></div>
      <div id="notepadTabContainer"></div>
      <div id="boardTabContainer"></div>
      <div id="bookmarksTabContainer"></div>
      <div id="settingsTabContainer"></div>
    </div>

  <div id="toast" class="toast"></div>

  <div id="validationErrorModal" class="modal-overlay">
    <div class="modal-box">
      <h5 data-i18n="validationErrorTitle"></h5>
      <p id="validationErrorMessage"></p>
      <div class="modal-actions">
        <button id="validationErrorOkBtn" class="button button-primary" data-i18n="validationErrorOk"></button>
      </div>
    </div>
  </div>
  </div>

  <script src="../libs/marked.min.js"></script>
  <script src="../libs/purify.min.js"></script>
  <script type="module" src="./options-main.js"></script>
</body>
</html>
