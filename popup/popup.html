<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title data-i18n="appName"></title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <h3 data-i18n="popupTitle"></h3>
    <p data-i18n="popupDescription"></p>

    <div class="toggle-wrapper loading">
      <span class="toggle-label" data-i18n="colorizerToggleLabel"></span>
      <label class="switch">
        <input type="checkbox" id="colorizerToggle" />
        <span class="switch-slider"></span>
      </label>
    </div>

    <button
      id="openOptionsBtn"
      class="button button-primary"
      data-i18n="popupOpenOptionsButton"
    ></button>
    <script src="./popup.js"></script>
  </body>
</html>
